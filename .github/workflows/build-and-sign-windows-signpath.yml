name: build-and-sign-windows-signpath

# 前提（缺一条 SignPath 会拒签或拒批）：
#   1. 本仓库是 tw93/Pake 的公开 fork（用 Fork 按钮生成），配置在 app/MarkdownEditor.json；
#      SignPath 条款要求「只签自己源码构建的产物」，从 fork 源码构建才满足「visibly uses a fork」。
#   2. 构建跑在 GitHub 官方 runner 上（本文件已是 windows-latest）。
#   3. Secrets：SIGNPATH_API_TOKEN / VALUE_SIGNPATH_ORG_ID / VALUE_SIGNPATH_PROJECT_SLUG / VALUE_SIGNPATH_POLICY_SLUG
#   4. 每次签名请求需在 SignPath 控制台由 Approver 人工批准。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-and-package:
    runs-on: windows-latest
    env:
      PAKE_USE_CN_MIRROR: "1"
      APP_NAME: MarkdownEditor
      APP_VERSION: 1.0.0
    steps:
      - name: Checkout (your Pake fork)
        uses: actions/checkout@v4

      - name: Preflight - repo must be a Pake fork with the app config
        id: cfg
        shell: bash
        run: |
          echo "repository=${{ github.repository }}"
          test -d src-tauri || { echo "::error::缺少 src-tauri —— 本工作流必须在 Pake 的 fork 内运行"; exit 1; }
          if [ -f app/MarkdownEditor.json ]; then
            echo "path=$PWD/app/MarkdownEditor.json" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ]; then
            echo "path=$PWD/app.json" >> "$GITHUB_OUTPUT"
            echo "::warning::用的是根目录 app.json，建议改名为 app/MarkdownEditor.json"
          else
            echo "::error::找不到 app/MarkdownEditor.json 或 app.json"
            ls -la; exit 1
          fi

      - name: Show config
        shell: pwsh
        run: Get-Content "${{ steps.cfg.outputs.path }}" -Raw

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm (version pinned in package.json packageManager)
        shell: pwsh
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies and build the Pake CLI from this fork
        shell: pwsh
        run: |
          pnpm install
          pnpm run cli:build
          if (-not (Test-Path dist/cli.js)) { throw "dist/cli.js 未生成" }

      - name: Build the app
        shell: bash
        run: |
          set +e
          # 在 fork 检出内必须用 node dist/cli.js，不能用全局 pake-cli
          node dist/cli.js --config "${{ steps.cfg.outputs.path }}" --keep-binary --json > result.json 2> build.log
          code=$?
          set -e
          echo "===== build.log ====="; cat build.log || true
          echo "===== result.json ====="; cat result.json || true
          { echo "exit_code=$code"; echo; echo "--- build.log ---"; cat build.log 2>/dev/null; echo; echo "--- result.json ---"; cat result.json 2>/dev/null; } > pake-diagnostics.txt
          # 0 成功 / 2 参数或配置错 / 3 构建失败 / 4 环境或依赖缺失 / 1 意外
          if [ "$code" -ne 0 ]; then
            msg=$(node -e "try{const r=require('./result.json');if(r&&r.error)console.log(r.error.code+': '+r.error.message+' | hint: '+(r.error.hint||''))}catch(e){}" 2>/dev/null)
            echo "::error::pake 失败 exit=$code ${msg:-（见 pake-diagnostics 附件）}"
            exit "$code"
          fi
          ls -la "$APP_NAME.exe" "$APP_NAME.msi" || ls -la

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pake-diagnostics
          path: pake-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      # SignPath 只接受先进过 GitHub Actions artifact 存储的产物
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ env.APP_NAME }}
          path: ${{ env.APP_NAME }}.exe
          retention-days: 1

      - name: Submit SignPath signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.VALUE_SIGNPATH_ORG_ID }}"
          project-slug: "${{ secrets.VALUE_SIGNPATH_PROJECT_SLUG }}"
          signing-policy-slug: "${{ secrets.VALUE_SIGNPATH_POLICY_SLUG }}"
          github-artifact-id: "${{ steps.upload-unsigned.outputs.artifact-id }}"
          wait-for-completion: true
          # 人工批准要等：默认 600s 不够
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: ./signed
          # 只有当该 artifact 配置定义了名为 version 的用户参数时才保留下面两行，
          # 多余参数会让签名请求失败，此时请整段删除 parameters
          parameters: |
            version: "${{ env.APP_VERSION }}"

      - name: Verify signature and package
        shell: pwsh
        run: |
          $signed = Get-ChildItem ./signed -Recurse -Filter "$env:APP_NAME.exe" | Select-Object -First 1
          if (-not $signed) {
            Write-Host "signed 目录内容："; Get-ChildItem ./signed -Recurse | Format-Table FullName
            throw "未取回签名后的 exe"
          }
          Get-AuthenticodeSignature $signed.FullName | Format-List Status, StatusMessage, SignerCertificate
          if ((Get-AuthenticodeSignature $signed.FullName).Status -ne 'Valid') { throw "签名校验未通过" }
          Copy-Item $signed.FullName ./$env:APP_NAME.exe -Force
          Compress-Archive -Path ./$env:APP_NAME.exe -DestinationPath ("./" + $env:APP_NAME + "-win-x64-signed-portable.zip") -Force
          "signing request: ${{ steps.sign.outputs.signing-request-web-url }}" | Out-File ./build-summary.md
          "signed exe bytes: $((Get-Item ./$env:APP_NAME.exe).Length)" | Out-File -Append ./build-summary.md
          "MSI 未签名：如需签名请在 SignPath 再建一个 artifact 配置并把 MarkdownEditor.msi 一起 upload" | Out-File -Append ./build-summary.md

      - name: Upload signed portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win-x64-signed-portable
          path: ${{ env.APP_NAME }}-win-x64-signed-portable.zip
          if-no-files-found: error

      - name: Summary

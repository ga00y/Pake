name: build-windows-unsigned

# 用途：先出一个「未签名但可用」的 Windows 包，用于建 GitHub Release
# （SignPath 要求项目已按将被签名的形式发布过）。本工作流不需要任何 secrets。

on:
  workflow_dispatch:
  push:
    paths:
      - app.json
      - app/MarkdownEditor.json
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PAKE_USE_CN_MIRROR: "1"
      APP_NAME: MarkdownEditor
    steps:
      - uses: actions/checkout@v4

      - name: Locate the config file
        id: cfg
        shell: bash
        run: |
          # 允许配置放在 app/MarkdownEditor.json（fork 布局）或根目录 app.json（独立仓库布局）
          if [ -f app/MarkdownEditor.json ]; then
            echo "path=$PWD/app/MarkdownEditor.json" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ]; then
            echo "path=$PWD/app.json" >> "$GITHUB_OUTPUT"
          else
            echo "::error::找不到 app/MarkdownEditor.json 或 app.json —— 请检查文件是否真的提交到仓库了"
            ls -la; [ -d app ] && ls -la app
            exit 1
          fi

      - name: Show config and check build mode
        shell: pwsh
        run: |
          $cfg = "${{ steps.cfg.outputs.path }}"
          Write-Host "===== $cfg ====="
          Get-Content $cfg -Raw
          if (Test-Path src-tauri) {
            "repo_has_pake_source=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            "检测到 src-tauri：从本仓库（fork）源码构建"
          } else {
            "repo_has_pake_source=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            "未检测到 src-tauri：改用发布版 pake-cli"
          }
          node --version; Get-Command pnpm -ErrorAction SilentlyContinue | Select-Object Source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build from fork source (pnpm)
        if: env.repo_has_pake_source == 'true'
        shell: bash
        run: |
          corepack enable
          pnpm --version
          pnpm install
          pnpm run cli:build
          test -f dist/cli.js || { echo "::error::node dist/cli.js 未生成，pnpm run cli:build 失败"; exit 1; }

      - name: Install published pake-cli (fallback)
        if: env.repo_has_pake_source != 'true'
        shell: bash
        run: npm install -g pake-cli --no-fund --no-audit

      - name: Build the app
        shell: bash
        run: |
          set +e
          if [ -f dist/cli.js ]; then
            node dist/cli.js --config "${{ steps.cfg.outputs.path }}" --json > result.json 2> build.log
          else
            pake --config "${{ steps.cfg.outputs.path }}" --json > result.json 2> build.log
          fi
          code=$?
          set -e
          echo "===== build.log ====="; cat build.log || true
          echo "===== result.json ====="; cat result.json || true
          { echo "exit_code=$code"; echo; echo "--- build.log ---"; cat build.log 2>/dev/null; echo; echo "--- result.json ---"; cat result.json 2>/dev/null; } > pake-diagnostics.txt
          # 退出码：0 成功 / 2 参数或配置错 / 3 构建失败 / 4 环境缺依赖 / 1 意外
          if [ "$code" -ne 0 ]; then
            msg=$(node -e "try{const r=require('./result.json');if(r&&r.error)console.log(r.error.code+': '+r.error.message+' | hint: '+(r.error.hint||''))}catch(e){}" 2>/dev/null)
            echo "::error::pake 失败 exit=$code ${msg:-（result.json 无 error 字段，见 pake-diagnostics 附件）}"
            exit "$code"
          fi
          ls -la "$APP_NAME.exe" "$APP_NAME.msi"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pake-diagnostics
          path: pake-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Zip the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "./$env:APP_NAME.exe" -DestinationPath ("./" + $env:APP_NAME + "-win-x64-portable.zip") -Force
          Get-Item "./$env:APP_NAME-win-x64-portable.zip" | Select-Object Name, Length

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win-x64-portable
          path: ${{ env.APP_NAME }}-win-x64-portable.zip
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win-x64-msi
          path: ${{ env.APP_NAME }}.msi
          if-no-files-found: ignore

      - name: How to make the Release
        if: success()
        shell: bash
        run: |
          {
            echo "## 未签名构建完成"
            echo
            echo "下载下面的 artifact，把 \`$APP_NAME-win-x64-portable.zip\` 和 msi 传到 GitHub Release（Draft a new release → tag v1.0.0），SignPath 申请时要能点到这个 Release。"
          } >> "$GITHUB_STEP_SUMMARY"
